services:
  - type: web
    name: memory-match
    runtime: node
    plan: starter # Note: Persistent Disks on Render require an instance type with disk support (Starter). For free tier, remove the disk section.
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: memory-match-data
      mountPath: /var/data
      sizeGB: 1
